name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel obsolete PR runs, but never interrupt main verification/deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      compatibility: ${{ steps.classify.outputs.compatibility }}
      website: ${{ steps.classify.outputs.website }}
      generated: ${{ steps.classify.outputs.generated }}
      browser: ${{ steps.classify.outputs.browser }}
      browserProfile: ${{ steps.classify.outputs.browserProfile }}
      browserTests: ${{ steps.classify.outputs.browserTests }}
      webm: ${{ steps.classify.outputs.webm }}
      webmProfile: ${{ steps.classify.outputs.webmProfile }}
      package: ${{ steps.classify.outputs.package }}
      windows: ${{ steps.classify.outputs.windows }}
      manifest: ${{ steps.classify.outputs.manifest }}
      owners: ${{ steps.classify.outputs.owners }}
      changedTests: ${{ steps.classify.outputs.changedTests }}
    steps:
      # Classification compares two trees, not their shared history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - name: Fetch PR comparison base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$CI_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
      - name: Fetch dev push comparison base when available
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CI_BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" || echo 'Comparison base unavailable; classification requires full CI.'
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Classify changed paths
        id: classify
        run: node scripts/ci-scope.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_REF: ${{ github.ref }}
      - uses: ./.github/actions/setup-pnpm
        if: steps.classify.outputs.scope == 'docs' && (contains(fromJSON(steps.classify.outputs.owners), 'readme') || contains(fromJSON(steps.classify.outputs.owners), 'changelog'))
      - name: Install documentation check dependencies
        if: steps.classify.outputs.scope == 'docs' && (contains(fromJSON(steps.classify.outputs.owners), 'readme') || contains(fromJSON(steps.classify.outputs.owners), 'changelog'))
        run: pnpm --filter archify-repository install --frozen-lockfile --ignore-scripts
      - name: Check affected documentation contracts
        if: steps.classify.outputs.scope == 'docs'
        run: node scripts/run-affected-tests.mjs
        env:
          CI_TEST_OWNERS: ${{ steps.classify.outputs.owners }}
          CI_CHANGED_TESTS: ${{ steps.classify.outputs.changedTests }}

  full-regression:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        include:
          - shard: analysis-1
            module-shard: 1
          - shard: analysis-2
            module-shard: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: ./.github/actions/setup-pnpm
      - name: Install regression dependencies
        run: pnpm install --frozen-lockfile
      # Reuse a shard's installed runtime instead of bootstrapping after all
      # shards finish. These checks still run exactly once in complete CI.
      - name: Generated outputs and representative goldens
        if: matrix.shard == 2
        run: pnpm run test:generated
      - name: Verify community Hermes adapter
        if: matrix.shard == 2
        run: node --test integrations/hermes-agent/test/plugin-contract.test.mjs
      - name: Install Code Analysis duplicate detector
        if: matrix.module-shard
        run: npm install --prefix "$RUNNER_TEMP/archify-jscpd" --ignore-scripts --no-audit --no-fund jscpd@5.4.3
      - name: Install Code Analysis C/C++ parser
        if: matrix.module-shard
        run: |
          python3 -m venv "$RUNNER_TEMP/archify-clang"
          "$RUNNER_TEMP/archify-clang/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --no-deps libclang==18.1.1
      # The root runner enumerates only test/; the module suite lives with the module.
      - name: Verify generated Code Analysis Python parser
        if: matrix.module-shard == 1
        run: pnpm run check:python
        working-directory: archify/modules/code-analysis
      - name: Verify vendored Code Analysis packages
        if: matrix.module-shard == 1
        run: pnpm run check:vendor
        working-directory: archify/modules/code-analysis
      - name: Code Analysis module suite
        if: matrix.module-shard
        run: node --test --test-shard=${{ matrix.module-shard }}/2 test/*.test.mjs
        working-directory: archify/modules/code-analysis
        env:
          ARCHIFY_TEST_JSCPD: ${{ runner.temp }}/archify-jscpd/node_modules/.bin/jscpd
          ARCHIFY_CPP_PYTHON: ${{ runner.temp }}/archify-clang/bin/python
          ARCHIFY_CPP_REQUIRED: '1'
      - name: Run a complete regression shard
        if: '!matrix.module-shard'
        run: node scripts/run-tests.mjs --shard=${{ matrix.shard }}/4

  test:
    needs: scope
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 24]
    steps:
      # Keep every required matrix check present; fail closed if classification/checks fail.
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_COMPATIBILITY: ${{ needs.scope.outputs.compatibility }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_SCOPE:$CI_COMPATIBILITY" in docs:false|core:false|core:true|full:true) ;; *) exit 1 ;; esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.scope.outputs.compatibility == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.scope.outputs.compatibility == 'true'
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/setup-pnpm
        if: needs.scope.outputs.compatibility == 'true'
      - name: Install renderer dependencies
        if: needs.scope.outputs.compatibility == 'true'
        run: pnpm install --frozen-lockfile
      - name: Supported Node runtime compatibility
        if: needs.scope.outputs.compatibility == 'true'
        run: pnpm run test:compat

  canonical-test:
    name: test (22)
    needs: [scope, full-regression]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Keep every required matrix check present; fail closed if classification/checks fail.
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_SCOPE" in docs|core|full) ;; *) exit 1 ;; esac
      - name: Require complete regression shards
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          REGRESSION_RESULT: ${{ needs.full-regression.result }}
        shell: bash
        run: |
          case "$CI_SCOPE:$REGRESSION_RESULT" in
            full:success|core:skipped|docs:skipped) ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.scope.outputs.scope == 'core'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.scope.outputs.scope == 'core'
        with:
          package-manager-cache: false
          node-version: 22
      - uses: ./.github/actions/setup-pnpm
        if: needs.scope.outputs.scope == 'core'
      - name: Install renderer dependencies
        if: needs.scope.outputs.scope == 'core'
        run: pnpm install --frozen-lockfile
      - name: Core public CLI contracts
        if: needs.scope.outputs.scope == 'core' && needs.scope.outputs.compatibility == 'true'
        run: pnpm test
      - name: Generated outputs and representative goldens
        if: needs.scope.outputs.scope == 'core' && needs.scope.outputs.generated == 'true'
        run: pnpm run test:generated
      - name: Check site builders with changed render inputs
        if: needs.scope.outputs.scope == 'core' && needs.scope.outputs.generated == 'true' && needs.scope.outputs.website == 'false'
        run: node --test --test-name-pattern='custom site builders' test/site-language-integration.mjs
      - name: Changed tests and owned regression suites
        if: needs.scope.outputs.scope == 'core'
        run: pnpm run test:affected
        env:
          CI_TEST_OWNERS: ${{ needs.scope.outputs.owners }}
          CI_CHANGED_TESTS: ${{ needs.scope.outputs.changedTests }}

  browser-regression:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Share setup across up to four focused suites.
        shard: ${{ fromJSON((needs.scope.outputs.browserProfile != 'changed' || fromJSON(needs.scope.outputs.browserTests || '[]')[4]) && '[1,2,3,4]' || '[1]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Provision a known Chrome runtime
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: ./.github/actions/setup-pnpm
      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run shared browser regression gate
        run: pnpm run test:browser --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
          ARCHIFY_STORY_EVIDENCE_DIR: ${{ runner.temp }}/archify-story-evidence
          CI_BROWSER_PROFILE: ${{ needs.scope.outputs.browserProfile }}
          CI_BROWSER_TESTS: ${{ needs.scope.outputs.browserTests }}
          CI_STORY_BROWSER_OWNER: ${{ needs.scope.outputs.webm == 'true' && needs.scope.outputs.webmProfile != 'viewer' && 'webm' || 'browser' }}
      - name: Upload Story video diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: story-browser-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/archify-story-evidence
          if-no-files-found: ignore

  webm-decode:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.webm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Provision a known Chrome runtime
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      # Some ubuntu-latest hosts set kernel.apparmor_restrict_unprivileged_userns=1,
      # which denies the unconfined Chrome for Testing binary the user namespace its
      # sandbox needs ("No usable sandbox!"). Grant exactly that binary the userns
      # permission with its own AppArmor profile, as Chromium documents, rather than
      # disabling the sandbox or relaxing the restriction for the whole runner.
      - name: Let the provisioned Chrome start with its sandbox
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        shell: bash
        run: |
          restrict="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
          echo "kernel.apparmor_restrict_unprivileged_userns=$restrict"
          if [ "$restrict" = 1 ]; then
            chrome_binary="$(readlink -f "$CHROME_PATH")"
            sudo tee /etc/apparmor.d/archify-ci-chrome >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile archify-ci-chrome "$chrome_binary" flags=(unconfined) {
            userns,
            include if exists <local/archify-ci-chrome>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/archify-ci-chrome
          fi
          # Fail here with a clear cause if sandboxed Chrome still cannot start.
          profile_dir="$(mktemp -d)"
          timeout 60 "$CHROME_PATH" --headless=new --disable-gpu --user-data-dir="$profile_dir" --dump-dom about:blank >/dev/null
          rm -rf "$profile_dir"
      - name: Install the WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Verify selected media exports with FFmpeg
        run: node test/webm-artifact.smoke.mjs "$CI_WEBM_PROFILE"
        env:
          CI_WEBM_PROFILE: ${{ needs.scope.outputs.webmProfile }}
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'

  webm-artifact:
    needs: [scope, browser-regression, webm-decode]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Verify media jobs against the CI plan
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_BROWSER: ${{ needs.scope.outputs.browser }}
          CI_BROWSER_PROFILE: ${{ needs.scope.outputs.browserProfile }}
          CI_WEBM: ${{ needs.scope.outputs.webm }}
          CI_WEBM_PROFILE: ${{ needs.scope.outputs.webmProfile }}
          BROWSER_RESULT: ${{ needs.browser-regression.result }}
          WEBM_RESULT: ${{ needs.webm-decode.result }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_SCOPE:$CI_BROWSER:$CI_BROWSER_PROFILE:$CI_WEBM" in
            docs:false:full:false|full:true:full:*|core:false:full:*|core:true:full:*|core:true:atlas:false|core:true:changed:*) ;;
            *) echo "Invalid media scope $CI_SCOPE/$CI_BROWSER/$CI_BROWSER_PROFILE/$CI_WEBM"; exit 1 ;;
          esac
          case "$CI_SCOPE:$CI_WEBM:$CI_WEBM_PROFILE" in
            *:false:full|*:true:full|core:true:viewer|core:true:story) ;;
            *) echo "Invalid WebM profile '$CI_WEBM_PROFILE'"; exit 1 ;;
          esac
          require_media_result() {
            case "$2:$3" in
              true:success|false:skipped) ;;
              *) echo "Unexpected $1 result '$3' with requested flag '$2'"; exit 1 ;;
            esac
          }
          require_media_result browser "$CI_BROWSER" "$BROWSER_RESULT"
          require_media_result WebM "$CI_WEBM" "$WEBM_RESULT"

  zip-freshness:
    needs: scope
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      # Keep every required matrix check present; fail closed if classification/checks fail.
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_SCOPE" in docs|core|full) ;; *) exit 1 ;; esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.scope.outputs.package == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.scope.outputs.package == 'true'
        with:
          package-manager-cache: false
          node-version: 22
      - name: Rebuild archify.zip and compare exact bytes
        if: needs.scope.outputs.package == 'true'
        run: |
          scripts/build-zip.sh /tmp/fresh.zip
          if ! cmp -s /tmp/fresh.zip archify.zip; then
            echo '::error::archify.zip is stale — run scripts/build-zip.sh and commit the result'
            exit 1
          fi

  published-update-manifest:
    needs: scope
    if: >-
      always() && !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.manifest == 'false'
      && (needs.scope.outputs.scope == 'docs' || needs.scope.outputs.scope == 'core'))
    runs-on: ubuntu-latest
    steps:
      # Keep every required matrix check present; fail closed if classification/checks fail.
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          RUN_MANIFEST: ${{ needs.scope.outputs.manifest }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          test "$RUN_MANIFEST" = true
          case "$CI_SCOPE" in docs|core|full) ;; *) exit 1 ;; esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Public notifier manifest must reference an existing stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_version="$(node --input-type=module -e 'import fs from "node:fs"; import { validateStableUpdateManifest } from "./archify/scripts/update-contract.mjs"; process.stdout.write(validateStableUpdateManifest(JSON.parse(fs.readFileSync("./docs/skill-updates/archify/stable.json", "utf8"))).version);')"
          # Independent adapter releases such as archify-dsh-v1.1.0 are stable
          # GitHub releases too, so releases/latest can name them instead of the
          # Archify Skill. Select the newest release whose tag is an Archify
          # v<major>.<minor>.<patch> tag.
          latest_stable_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tag_name')"
          if [[ "$latest_stable_tag" != "v${manifest_version}" ]]; then
            echo "::error::stable.json v${manifest_version} must match the latest published stable Release ${latest_stable_tag:-'(missing)'}"
            exit 1
          fi
          release_asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${manifest_version}" --jq 'select(.draft == false and .prerelease == false) | .assets[] | select(.name == "archify.zip") | .id')"
          if [[ -z "$release_asset_id" ]]; then
            echo "::error::v${manifest_version} must have a published stable GitHub Release with an archify.zip asset before stable.json is merged"
            exit 1
          fi
          published_archive="$RUNNER_TEMP/archify-v${manifest_version}.zip"
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${release_asset_id}" \
            -H 'Accept: application/octet-stream' > "$published_archive"
          git fetch --force --no-tags --depth=1 origin \
            "refs/tags/v${manifest_version}:refs/tags/v${manifest_version}"
          tagged_archive="$RUNNER_TEMP/archify-tag-v${manifest_version}.zip"
          git show "v${manifest_version}:archify.zip" > "$tagged_archive"
          if ! cmp -s "$published_archive" "$tagged_archive"; then
            echo "::error::the published archify.zip asset must byte-match archify.zip committed at v${manifest_version}"
            exit 1
          fi
          node scripts/check-stable-update-manifest.mjs \
            --archive "$published_archive" \
            --tag "v${manifest_version}" \
            --source-ref "v${manifest_version}"
          if git cat-file -e "v${manifest_version}:scripts/stage-clean-skill.mjs" 2>/dev/null \
            && git cat-file -e "v${manifest_version}:scripts/write-deterministic-zip.mjs" 2>/dev/null; then
            tag_checkout="$RUNNER_TEMP/archify-tag-v${manifest_version}"
            rebuilt_archive="$RUNNER_TEMP/archify-rebuilt-v${manifest_version}.zip"
            git worktree add --detach "$tag_checkout" "v${manifest_version}"
            "$tag_checkout/scripts/build-zip.sh" "$rebuilt_archive"
            if ! cmp -s "$rebuilt_archive" "$tagged_archive"; then
              echo "::error::archify.zip committed at v${manifest_version} is not the deterministic build of that tag"
              exit 1
            fi
          elif [[ "$manifest_version" == "2.15.0" ]]; then
            echo "::notice::v2.15.0 predates the deterministic builder; its published asset is bound to the exact tagged archive blob"
          else
            echo "::error::v${manifest_version} is missing the deterministic archive builder"
            exit 1
          fi

  package-smoke:
    needs: scope
    if: always() && !cancelled()
    name: package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep every required matrix check present; fail closed if classification/checks fail.
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_SCOPE" in docs|core|full) ;; *) exit 1 ;; esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.scope.outputs.package == 'true' || (needs.scope.outputs.windows == 'true' && runner.os != 'Linux')
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.scope.outputs.package == 'true' || (needs.scope.outputs.windows == 'true' && runner.os != 'Linux')
        with:
          package-manager-cache: false
          node-version: 22
      - name: Extract packaged skill
        if: needs.scope.outputs.package == 'true' && (runner.os != 'Windows')
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/archify-package"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          unzip -q archify.zip -d "$package_root"
      - name: Extract packaged skill
        if: needs.scope.outputs.package == 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'archify-package'
          if (Test-Path $packageRoot) { Remove-Item -Recurse -Force $packageRoot }
          Expand-Archive -Path archify.zip -DestinationPath $packageRoot
      - name: Validate packaged skill without installing dependencies
        if: needs.scope.outputs.package == 'true'
        run: node scripts/package-smoke.mjs
      - uses: ./.github/actions/setup-pnpm
        if: needs.scope.outputs.scope == 'full' || (needs.scope.outputs.windows == 'true' && runner.os != 'Linux')
      - name: Install repository test dependencies
        if: needs.scope.outputs.scope == 'full' || (needs.scope.outputs.windows == 'true' && runner.os != 'Linux')
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify delivery-lock ownership with real subprocesses
        if: needs.scope.outputs.windows == 'true' && runner.os != 'Linux'
        run: >-
          node --test
          --test-name-pattern="cli: portable delivery lock:"
          test/cli-delivery-lock.test.mjs
      - name: Verify macOS opener stays behind delivery-lock release
        if: needs.scope.outputs.windows == 'true' && runner.os == 'macOS'
        run: >-
          node --test
          --test-name-pattern="cli: lock release failure does not invoke the requested opener"
          test/cli-delivery-lock.test.mjs

      # Linux covers the bundled SDK in the complete module suite. Keep both
      # additional SDK versions here, plus the native macOS and Windows runs.
      - name: Verify JS/TS project selection, resolution and calls
        if: needs.scope.outputs.scope == 'full' && runner.os != 'Linux'
        run: >-
          node --test
          archify/modules/code-analysis/test/ts-sdk.test.mjs
          archify/modules/code-analysis/test/ts-projects.test.mjs
          archify/modules/code-analysis/test/ts-snapshot.test.mjs
          archify/modules/code-analysis/test/ts-upstream-alignment.test.mjs
          archify/modules/code-analysis/test/ts-upstream-ledger.test.mjs
          archify/modules/code-analysis/test/ts-official-projects.test.mjs
          archify/modules/code-analysis/test/ts-official-modules.test.mjs
          archify/modules/code-analysis/test/ts-official-syntax.test.mjs
          archify/modules/code-analysis/test/ts-official-definitions.test.mjs
          archify/modules/code-analysis/test/calls.test.mjs
      - name: Install boundary TypeScript SDKs in temporary directories
        if: needs.scope.outputs.scope == 'full' && runner.os == 'Linux'
        shell: bash
        run: |
          for version in 5.6.3 6.0.3; do
            npm install --prefix "$RUNNER_TEMP/archify-ts-$version" --ignore-scripts --no-audit --no-fund --no-save "typescript@$version"
          done
      - name: Compare official engines at supported version boundaries
        if: needs.scope.outputs.scope == 'full' && runner.os == 'Linux'
        shell: bash
        run: |
          for version in 5.6.3 6.0.3; do
            ARCHIFY_TEST_TYPESCRIPT_SDK="$RUNNER_TEMP/archify-ts-$version/node_modules/typescript" node --test \
              archify/modules/code-analysis/test/ts-official-projects.test.mjs \
              archify/modules/code-analysis/test/ts-official-modules.test.mjs \
              archify/modules/code-analysis/test/ts-official-syntax.test.mjs \
              archify/modules/code-analysis/test/ts-official-definitions.test.mjs
          done

  website:
    needs: scope
    if: needs.scope.outputs.website == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pages, cloudflare]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: ./.github/actions/setup-pnpm
        with:
          workspace: website
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Typecheck and build website
        if: matrix.target == 'pages'
        run: pnpm run check && pnpm run build && pnpm test
        working-directory: website
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: website-chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install Chinese font coverage for website screenshots
        run: |
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-match 'sans-serif:lang=zh-cn'
      - name: Verify checked-in site language and navigation
        if: matrix.target == 'cloudflare'
        run: node --test test/site-language-integration.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.website-chrome.outputs.chrome-path }}
      - name: Verify built website navigation and language continuity
        if: matrix.target == 'pages'
        run: pnpm run test:browser
        working-directory: website
        env:
          ARCHIFY_SITE_ROOT: ${{ github.workspace }}/website/dist
          ARCHIFY_SITE_INTEGRATION: '1'
          ARCHIFY_CHROME: ${{ steps.website-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Build and validate the Cloudflare static website
        if: matrix.target == 'cloudflare'
        run: pnpm run build && node scripts/check-cloudflare-output.mjs && node --test test/deployment-target.test.mjs
        working-directory: website
        env:
          ARCHIFY_SITE_TARGET: cloudflare
      - name: Verify Cloudflare navigation and language continuity
        if: matrix.target == 'cloudflare'
        run: pnpm run test:browser
        working-directory: website
        env:
          ARCHIFY_SITE_ROOT: ${{ github.workspace }}/website/dist-cloudflare
          ARCHIFY_SITE_BASE: ''
          ARCHIFY_SITE_INTEGRATION: '1'
          ARCHIFY_CHROME: ${{ steps.website-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Upload homepage visual evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: website-homepage-evidence${{ matrix.target == 'cloudflare' && '-cloudflare' || '' }}
          path: website/.browser-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: matrix.target == 'pages'
        with:
          name: website-dist
          path: website/dist
          include-hidden-files: true
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: matrix.target == 'cloudflare'
        with:
          name: website-cloudflare-dist
          path: website/dist-cloudflare
          include-hidden-files: true
          if-no-files-found: error

  windows-test-portability:
    needs: scope
    # Reserve Windows runners for relevant changes and fail if classification is invalid.
    if: >-
      always() && !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.windows == 'false'
      && (needs.scope.outputs.scope == 'docs' || needs.scope.outputs.scope == 'core'))
    name: Windows test portability (Node ${{ matrix.node-version }})${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            profile: --controlled
          - node-version: 22
            profile: --contracts-1
            suffix: ' / contracts 1'
          - node-version: 22
            profile: --contracts-2
            suffix: ' / contracts 2'
          - node-version: 22
            profile: --portability
            suffix: ' / portability'
          - node-version: 24
            profile: --smoke
    runs-on: windows-latest
    steps:
      - name: Require successful scope checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          RUN_WINDOWS: ${{ needs.scope.outputs.windows }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_SCOPE" in docs|core|full) ;; *) exit 1 ;; esac
          test "$RUN_WINDOWS" = true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.scope.outputs.windows == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.scope.outputs.windows == 'true'
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/setup-pnpm
        if: needs.scope.outputs.windows == 'true'
      - name: Install test dependencies
        if: needs.scope.outputs.windows == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Java source bindings and Maven evidence on Windows
        if: needs.scope.outputs.windows == 'true' && matrix.profile == '--controlled'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:JAVA_HOME_17_X64) { throw 'The Windows runner must provide JDK 17.' }
          $env:ARCHIFY_JAVA = Join-Path $env:JAVA_HOME_17_X64 'bin/java.exe'
          & $env:ARCHIFY_JAVA -version
          $module = 'archify/modules/code-analysis'
          node --test --test-reporter=tap "$module/test/java-semantic.test.mjs" | Tee-Object -Variable semanticResults
          if ($semanticResults -notcontains '# skipped 0') { throw 'Java semantic tests must run without skips.' }

          $benchmark = 'benchmarks/java-binding-probe'
          $fixture = "$benchmark/fixture"
          $output = Join-Path $env:RUNNER_TEMP 'archify-java-binding'
          New-Item -ItemType Directory -Path $output | Out-Null
          & $env:ARCHIFY_JAVA "$module/extract/java/SourceBindings.java" $fixture 'api/src/main/java,app/src/main/java' "$output/maven.tsv" 8
          node "$module/test/run-extract.mjs" $fixture --language java --out "$output/maven-facts.json"
          node "$benchmark/compare.mjs" $fixture "$output/maven-facts.json" "$output/maven.tsv" "$benchmark/maven-queries.json" > "$output/maven.json"
          git diff --no-index --exit-code -- "$benchmark/results/maven.json" "$output/maven.json"
          node "$module/test/run-extract.mjs" $fixture --language java --config "$benchmark/semantic-config.json" --out "$output/maven-enhanced-facts.json"
          node "$benchmark/compare.mjs" $fixture "$output/maven-enhanced-facts.json" "$output/maven.tsv" "$benchmark/maven-queries.json" --enhanced > "$output/maven-enhanced.json"
          git diff --no-index --exit-code -- "$benchmark/results/maven-enhanced.json" "$output/maven-enhanced.json"
          Write-Output 'Both Maven reports match the committed target positions.'
      - name: Execute generated task commands in native cmd.exe
        if: needs.scope.outputs.windows == 'true' && (matrix.profile == '--controlled' || matrix.profile == '--smoke')
        run: node --test archify/modules/code-analysis/test/task-command-shell.test.mjs
      - name: Provision controlled Windows path fixtures
        id: windows-path-fixtures
        if: needs.scope.outputs.windows == 'true'
        shell: pwsh
        run: scripts/windows-path-fixtures.ps1 -NodeVersion '${{ matrix.node-version }}'
      - name: Verify maintained Windows path contracts
        if: needs.scope.outputs.windows == 'true'
        run: node scripts/run-windows-path-tests.mjs ${{ matrix.profile }}
        env:
          ARCHIFY_REQUIRE_WINDOWS_8DOT3: '1'
          ARCHIFY_REQUIRE_WINDOWS_REAL_PATHS: ${{ (matrix.profile == '--controlled' || matrix.profile == '--smoke') && '1' || '0' }}
      - name: Clean up controlled Windows path fixtures
        if: ${{ always() && steps.windows-path-fixtures.outcome != 'skipped' }}
        shell: pwsh
        run: scripts/windows-path-fixtures.ps1 -NodeVersion '${{ matrix.node-version }}' -Cleanup

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, canonical-test, webm-artifact, zip-freshness, published-update-manifest, package-smoke, windows-test-portability, website]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Reject an obsolete deployment run
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete Pages deployment for ${GITHUB_SHA}; main is ${current_main}"
          fi
      - name: Configure GitHub Pages
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download verified website build
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-dist
          path: website/dist
      - name: Upload verified website
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
          include-hidden-files: true
      - name: Deploy verified website
        if: steps.deployment-head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Enable after configuring a Pages project with production branch main.
  # Disable Git-connected automatic deployments so they cannot bypass these gates.
  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    needs: [test, canonical-test, webm-artifact, zip-freshness, published-update-manifest, package-smoke, windows-test-portability, website]
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Validate Cloudflare destination
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}[a-z0-9]$ ]] || exit 1
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || exit 1
          # Wrangler also discovers Functions relative to its working directory.
          test ! -e functions
      - name: Download verified Cloudflare website build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-cloudflare-dist
          path: website/dist-cloudflare
      - name: Reject an obsolete deployment run
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete Cloudflare deployment for ${GITHUB_SHA}; main is ${current_main}"
          fi
      - name: Deploy verified Cloudflare website
        if: steps.deployment-head.outputs.current == 'true'
        id: deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          packageManager: npm
          command: pages deploy website/dist-cloudflare --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
