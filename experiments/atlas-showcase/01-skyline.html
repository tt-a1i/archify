<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Skyline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --sky-top: #1c2350; --sky-mid: #4a3a78; --sky-low: #c9776b;
  --ground: #231c3a; --ink: #f6eee6; --muted: #c6b9d6;
  --lit: #ffd27a; --info: #ff9e57; --warn: #ff4f5e; --dim: #3c3a63;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 'Inter Tight', system-ui, sans-serif; display: flex; flex-direction: column; }
header { position: absolute; z-index: 2; left: 0; right: 0; top: 0; padding: 28px 32px; display: flex; justify-content: space-between; gap: 24px; pointer-events: none; }
header > * { pointer-events: auto; }
h1 { font: 800 clamp(40px, 6vw, 84px)/0.9 'Big Shoulders Display', sans-serif; margin: 0; letter-spacing: 0.01em; }
.lede { max-width: 46ch; color: var(--muted); margin: 10px 0 0; }
.legend { display: grid; gap: 6px; font-size: 13px; color: var(--muted); align-content: start; text-align: right; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
a.back { color: var(--muted); font-size: 13px; }
main { position: relative; flex: 1; min-height: 520px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#card { position: absolute; z-index: 3; right: 24px; bottom: 96px; width: min(380px, calc(100% - 48px)); background: rgba(28, 24, 58, .92); border: 1px solid #5a4d8c; border-radius: 14px; padding: 16px 18px; backdrop-filter: blur(6px); }
#card[hidden] { display: none; }
#card h2 { font: 800 30px/1 'Big Shoulders Display', sans-serif; margin: 0 0 2px; overflow-wrap: anywhere; }
#card .path { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#card ol { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
#card li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
#card li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#card li b { font: 800 18px 'Big Shoulders Display'; }
#card button { grid-column: 1 / -1; justify-self: start; border: 1px solid #7d6db8; background: none; color: var(--ink); border-radius: 999px; padding: 3px 12px; font: 500 12px 'Inter Tight', system-ui, sans-serif; cursor: pointer; }
#card button:hover, #card button:focus-visible { background: #7d6db8; outline: none; }
#tip { position: absolute; z-index: 4; pointer-events: none; background: var(--ink); color: #231c3a; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
#tip[hidden] { display: none; }
footer { padding: 12px 32px 16px; color: var(--muted); font-size: 12px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: space-between; }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="index.html">All views</a>
    <h1>Code skyline</h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="legend" aria-label="Legend">
    <span><i style="background:var(--lit)"></i>function under threshold</span>
    <span><i style="background:var(--info)"></i>info: complexity ≥ <b id="t-info"></b></span>
    <span><i style="background:var(--warn)"></i>warning: complexity ≥ <b id="t-warn"></b></span>
    <span>Height is the file's most complex function</span>
  </div>
</header>
<main>
  <canvas id="c" aria-label="Skyline of files: each building is a file"></canvas>
  <div id="tip" hidden></div>
  <aside id="card" hidden aria-live="polite"></aside>
</main>
<footer><span id="src"></span><span>Click a building to list its hardest functions.</span></footer>
<script src="data.js"></script>
<script src="lib.js"></script>
<script>
const { D, files, modules, T, level, fmt, esc, copyPrompt, fitCanvas, reducedMotion, totals } = Atlas;
document.getElementById('t-info').textContent = T.info.complexity;
document.getElementById('t-warn').textContent = T.warning.complexity;
document.getElementById('lede').textContent =
  `${fmt(totals.files)} files of ${D.repository.name}, ${fmt(totals.functions)} functions. ${totals.fnWarnings} functions light up red; the tallest towers are where reading gets hard.`;
document.getElementById('src').textContent = `Real run · ${D.repository.name} @ ${(D.repository.revision || 'working tree').slice(0, 10)} · ${D.repository.adapter}`;

const canvas = document.getElementById('c');
const tip = document.getElementById('tip');
const card = document.getElementById('card');
let layout = [], selected = -1, hover = -1, t0 = performance.now();
const maxCC = Math.max(...files.map((f) => f.maxCC));
const hOf = (cc) => Math.sqrt(cc / maxCC);

function build(w, h) {
  const horizon = h - 70;
  const gap = 2, districtGap = 14;
  const totalW = files.reduce((s, f) => s + Math.max(3, Math.sqrt(f.loc)), 0);
  const usable = w - 64 - districtGap * (modules.length - 1) - gap * files.length;
  const k = usable / totalW;
  let x = 32;
  layout = [];
  const districts = [];
  modules.forEach((m) => {
    const start = x;
    m.files.forEach((fi) => {
      const f = files[fi];
      const bw = Math.max(2, Math.sqrt(f.loc) * k);
      const bh = Math.max(6, hOf(f.maxCC) * (horizon - 230));
      layout[fi] = { x, y: horizon - bh, w: bw, h: bh };
      x += bw + gap;
    });
    districts.push({ m, x0: start, x1: x - gap });
    x += districtGap;
  });
  return { horizon, districts };
}

function draw(now) {
  const { ctx, w, h } = fitCanvas(canvas);
  const { horizon, districts } = build(w, h);
  const grow = reducedMotion ? 1 : Math.min(1, (now - t0) / 1400);
  const ease = 1 - Math.pow(1 - grow, 3);

  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#1c2350'); sky.addColorStop(0.62, '#4a3a78'); sky.addColorStop(1, '#c9776b');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);
  ctx.fillStyle = '#231c3a'; ctx.fillRect(0, horizon, w, h - horizon);

  const labels = [];
  // Threshold lines drawn as faint survey lines across the sky.
  const fnTop = (cc) => horizon - Math.max(6, hOf(cc) * (horizon - 230));
  [[T.info.complexity, 'info threshold', '#ff9e57'], [T.warning.complexity, 'warning threshold', '#ff4f5e']].forEach(([cc, label, col]) => {
    const y = fnTop(cc);
    ctx.strokeStyle = col; ctx.globalAlpha = 0.45; ctx.setLineDash([2, 6]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 0.85; ctx.fillStyle = col;
    ctx.globalAlpha = 1;
    labels.push([y, `${label} · ${cc}`, col]);
  });

  files.forEach((f, fi) => {
    const b = layout[fi];
    const bh = b.h * ease;
    const y = horizon - bh;
    const active = fi === selected || fi === hover;
    ctx.fillStyle = active ? '#5b4a96' : (f.warnings ? '#2e2552' : '#2a2a4e');
    ctx.fillRect(b.x, y, b.w, bh);
    // Windows: one per function, column-major from the ground up, coloured by complexity level.
    if (b.w >= 3) {
      const cols = Math.max(1, Math.floor((b.w - 1) / 3));
      const fns = f.fns;
      const rowsAvail = Math.floor((bh - 2) / 3);
      fns.forEach((fnIdx, k) => {
        const col = k % cols, row = Math.floor(k / cols);
        if (row >= rowsAvail) return;
        const cc = D.functions[fnIdx][3];
        const lv = level(cc);
        ctx.fillStyle = lv === 2 ? '#ff4f5e' : lv === 1 ? '#ff9e57' : ((fnIdx * 7) % 5 === 0 ? '#3c3a63' : '#ffd27a');
        ctx.globalAlpha = lv ? 1 : 0.55;
        ctx.fillRect(b.x + 1 + col * 3, horizon - 3 - row * 3, 2, 2);
      });
      ctx.globalAlpha = 1;
    }
    if (f.warnings && b.h > 120 && ease === 1) {
      ctx.fillStyle = '#ff4f5e';
      const blink = reducedMotion ? 1 : 0.55 + 0.45 * Math.sin(now / 400 + fi);
      ctx.globalAlpha = blink; ctx.beginPath(); ctx.arc(b.x + b.w / 2, y - 4, 1.8, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    }
  });

  ctx.font = '600 11px "Inter Tight", system-ui, sans-serif';
  labels.forEach(([y, text, col]) => {
    const tw = ctx.measureText(text).width;
    const x = w / 2 - tw / 2;
    ctx.fillStyle = 'rgba(28,24,58,.85)'; ctx.beginPath(); ctx.roundRect(x - 8, y - 9, tw + 16, 18, 9); ctx.fill();
    ctx.fillStyle = col; ctx.fillText(text, x, y + 4);
  });
  ctx.font = '500 11px "Inter Tight", system-ui, sans-serif';
  districts.forEach(({ m, x0, x1 }) => {
    ctx.fillStyle = '#c6b9d6';
    ctx.fillRect(x0, horizon + 8, Math.max(1, x1 - x0), 2);
    const label = m.label;
    if (x1 - x0 > ctx.measureText(label).width + 4) ctx.fillText(label, x0, horizon + 26);
    else if (x1 - x0 > 10) { ctx.save(); ctx.translate(x0 + 4, horizon + 16); ctx.rotate(Math.PI / 4); ctx.fillText(label, 0, 0); ctx.restore(); }
  });
  if (!reducedMotion) requestAnimationFrame(draw);
}

function hit(x, y) {
  for (let i = 0; i < layout.length; i += 1) {
    const b = layout[i];
    if (x >= b.x - 1 && x <= b.x + b.w + 1 && y >= b.y - 6) return i;
  }
  return -1;
}
canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  hover = hit(e.clientX - r.left, e.clientY - r.top);
  if (hover === -1) { tip.hidden = true; canvas.style.cursor = 'default'; if (reducedMotion) draw(0); return; }
  const f = files[hover];
  tip.hidden = false; canvas.style.cursor = 'pointer';
  tip.textContent = `${f.path} · max ${f.maxCC} · ${f.fns.length} fns`;
  tip.style.left = `${Math.min(e.clientX - r.left + 12, r.width - 260)}px`;
  tip.style.top = `${e.clientY - r.top - 30}px`;
  if (reducedMotion) draw(0);
});
canvas.addEventListener('mouseleave', () => { hover = -1; tip.hidden = true; });
canvas.addEventListener('click', () => { if (hover !== -1) select(hover); });

function select(fi) {
  selected = fi;
  const f = files[fi];
  const top = f.fns.map((i) => ({ i, fn: D.functions[i] })).sort((a, b) => b.fn[3] - a.fn[3]).slice(0, 5);
  card.hidden = false;
  card.innerHTML = `<h2>${esc(f.name)}</h2><div class="path">${esc(f.path)} · ${fmt(f.loc)} lines · ${f.fns.length} functions</div>
    <ol>${top.map(({ i, fn }) => `<li><span title="${esc(fn[1])}">${esc(fn[1])}</span><b style="color:${level(fn[3]) === 2 ? 'var(--warn)' : level(fn[3]) ? 'var(--info)' : 'var(--lit)'}">${fn[3]}</b>
      ${fn[6] !== -1 ? `<button data-f="${fn[6]}">Copy fix prompt for AI</button>` : ''}</li>`).join('')}</ol>`;
  card.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => copyPrompt(Number(b.dataset.f), b)));
  if (reducedMotion) draw(0);
}
// Open on the tallest tower so the first screen already says something.
select(files.reduce((best, f) => (f.maxCC > files[best].maxCC ? f.i : best), 0));
window.addEventListener('resize', () => reducedMotion && draw(0));
requestAnimationFrame(draw);
</script>
</body>
</html>
