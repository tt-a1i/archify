<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archify · 插画沙盘</title><style>body{margin:0;background:#e9efea;color:#29463e;font:16px system-ui}main{max-width:760px;margin:8vh auto;padding:32px}h1{font-size:42px}p{line-height:1.8;color:#647369}label{display:block;margin:24px 0 10px}select,button{font:inherit;padding:15px;border:1px solid #b5c3b7;border-radius:10px;background:#faf8ef;color:inherit;width:100%}button{margin-top:28px;background:#365e4e;color:white;cursor:pointer}small{display:block;line-height:1.8;margin-top:24px}a{color:inherit}</style><main><p>ARCHIFY / TRAVEL ATLAS</p><h1>用插画，走进一座城。</h1><p>统一的插画沙盘风格，按需要选择平面或立体展示。</p><label for="destination">目的地</label><select id="destination"><option value="shanghai">上海 · 陆家嘴与外滩局部</option><option value="paris">巴黎 · 三日旅行</option><option value="france">法国 · 国家总览</option></select><label for="precision">展示层级</label><select id="precision"><option value="3d">3D 有高度 · 立体建筑与插画地标</option><option value="flat">3D 无高度 · 可旋转的平面沙盘</option><option value="2d">2D · 平面插画</option></select><button id="apply">打开插画沙盘 →</button><small>三档展示使用相同地理数据；3D 高度包含艺术造型与估算，并非真实地形高程。当前仅提供以上示例，全球城市自动生成尚未接入。</small><p><a href="./index.html?view=3d#scene=paris">回到巴黎三日旅行 →</a></p></main><script>document.getElementById('apply').onclick=()=>{location.href='./index.html?view='+document.getElementById('precision').value+'#scene='+document.getElementById('destination').value};</script></html>
