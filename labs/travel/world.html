<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archify · 旅行计划</title><style>body{margin:0;background:#e9efea;color:#29463e;font:16px system-ui}main{max-width:700px;margin:5vh auto;padding:28px}h1{font-size:36px}p{line-height:1.7;color:#647369}textarea,select,button{box-sizing:border-box;font:inherit;padding:14px;border:1px solid #b5c3b7;border-radius:10px;background:#faf8ef;color:inherit;width:100%}button{margin:14px 0;background:#365e4e;color:white;cursor:pointer}label{display:block;margin:22px 0 10px}small{display:block;line-height:1.8;color:#647369}</style><main><p>ARCHIFY / TRAVEL</p><h1>一句话，计划一段旅行。</h1><p>在当前宿主 Agent 中描述城市、天数和喜好。它会生成流程图，以及可旋转的 3D 行程。</p><textarea id="prompt" rows="3" aria-label="旅行需求">上海4天亲子慢游，包含陆家嘴、东方明珠、迪士尼和环球金融中心</textarea><button id="copy">复制需求给 Agent</button><small id="status" role="status">复制后粘贴到宿主对话。此页面不直接调用模型。</small><label for="destination">或先体验已有示例</label><select id="destination"><option value="shanghai">上海三日游</option><option value="paris">巴黎三日游</option></select><button id="apply">打开示例流程图 →</button><small>总览只显示地标和箭头；点击某一天，打开独立地图方块。</small></main><script>document.getElementById('copy').onclick=async()=>{const text='请按本项目 labs/travel/SKILL.md 使用宿主 LLM 生成旅行计划：'+document.getElementById('prompt').value;try{await navigator.clipboard.writeText(text);document.getElementById('status').textContent='已复制，请粘贴到当前宿主 Agent 对话。';}catch{document.getElementById('status').textContent='请复制上面的需求到宿主对话，并让它按 labs/travel/SKILL.md 生成。';}};document.getElementById('apply').onclick=()=>{location.href='./index.html?view=flow&destination='+document.getElementById('destination').value+'#scene=journey'};</script></html>
