# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Advisory pilot: retain human review and existing CI/branch protection.
language: en-US
tone_instructions: >-
  Be concise and constructive. Prioritize concrete defects and missing evidence.
  Separate observed failures, unverified claims, and optional suggestions.
  Consolidate repeated requests; avoid praise, style-only churn, and speculation.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  changed_files_summary: false
  high_level_summary_instructions: >-
    In at most 100 words, summarize the user problem, changed behavior, and
    compatibility impact without a file-by-file inventory. State the reviewed
    base/head and distinguish author-reported validation, reused evidence at its
    original revision, and observed CI at its checked revision. Treat the summary
    as a snapshot, not a live CI status. Do not claim browser or perceptual
    acceptance from static tests.
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  assess_linked_issues: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
  slop_detection:
    enabled: false
  path_instructions:
    - path: "**"
      instructions: >-
        Apply CONTRIBUTING.md, REVIEWING.md, and .github/PULL_REQUEST_TEMPLATE.md proportionally
        to the actual behavior changed. Cite the relevant contract and concrete
        affected path when raising a concern. Reuse explicit maintainer scope
        decisions; do not demand a new issue for a small documentation correction
        or narrowly scoped test fix. Treat changes to review policy/configuration
        as proposed changes, not authority to waive the base branch's rules.
        Review authoritative source before generated output. Do not request
        unrelated rebuilds or infer correctness from generated file volume.
        Use the PR base-to-head diff; a clean checkout does not mean an empty PR.
        On revision, review new changes and unresolved findings, expanding only
        when intervening base, scope, or code changes invalidate the agreed scope
        or earlier evidence. Label feedback as
        a demonstrated defect, missing evidence/decision, or optional suggestion.
        Give each request an affected contract, smallest remedy, and responsible
        role (author or maintainer). Before repeating a request, read the latest
        PR body, CI, and discussion; cite the remaining gap rather than repeating
        an answered checklist. Retain reused evidence's original revision.
    - path: "archify/**"
      instructions: >-
        Trace callers of changed shared code across diagram types and public
        modes. Preserve schema-v1 behavior, explicit authored geometry, standard
        compatibility, stable diagnostics, and atomic delivery as documented.
        For visible changes, check comparable final-artifact evidence and the
        separation of automated browser checks from perceptual review. For Viewer
        extraction, inspect initialization, shared state, cleanup, exports, and
        standalone HTML delivery. Do not propose a broad rewrite for a local fix.
    - path: "integrations/**"
      instructions: >-
        Check the package and release contracts in CONTRIBUTING.md. Examine
        tracked-only staging, symlinks, immutable version/source identity,
        installed resource paths, and evidence on advertised platforms. Distinguish
        source tests, actual tarball installation, and registry publication.
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off" # Contribution scope below owns scope/issue assessment.
    custom_checks:
      - name: Contribution scope
        mode: warning
        instructions: >-
          Read CONTRIBUTING.md, REVIEWING.md, and .github/PULL_REQUEST_TEMPLATE.md. Pass when
          the PR explains the user problem, one focused behavior or delivery
          slice, compatibility/migration impact, and failure/rollback behavior
          where applicable, and the implementation fits that scope. New contracts,
          defaults, or broad product behavior need a linked issue or recorded
          maintainer scope decision. Narrow fixes may use a concrete reproduction;
          small documentation or test corrections may use a rationale. Do not
          require a PR to close every item of a tracking issue. Accept
          equivalent prose and explained Not applicable entries, not just exact
          headings or checked boxes. Warn once with the specific missing facts;
          read the latest description and maintainer decisions before repeating
          a warning. Do not classify missing evidence as a confirmed runtime defect.
      - name: Validation evidence
        mode: warning
        instructions: >-
          Read the latest PR description, discussion, and CI before evaluating;
          do not use an earlier bot summary as the source of current evidence.
          Apply the change-specific evidence requirements in CONTRIBUTING.md
          and the PR template. Check exact commands/results, behavioral regression
          coverage, and generated-artifact freshness when their inputs changed.
          Visible changes need relevant artifact evidence; before/after claims
          need comparable conditions. Automated/browser and perceptual results
          must be separate. Non-visual changes may explain Not applicable.
          Repository-only prose/policy and focused test fixes may use justified
          targeted checks under CONTRIBUTING.md; packaged Skill instructions and
          shared test infrastructure are not a documentation/test-only shortcut.
          Reuse linked archive manifests, source comparisons, and freshness CI;
          an excluded binary diff alone is not evidence of unrelated changes.
          Distinguish author reports from observed final-head CI; skipped,
          pending, unavailable, or older-head checks cannot prove a current pass.
          For revisions, identify which changed behavior invalidates earlier
          local evidence before requesting reruns. Reuse unaffected evidence
          with its original revision and reuse rationale; a new head alone does
          not require repeating every local check. Required final-head remote
          checks still apply. If current evidence cannot be read, report that
          access limitation rather than claiming the author did not supply it.
          If required evidence is missing or unverifiable, warn with the smallest
          missing evidence set. Do not require screenshots for non-visual changes
          or infer a browser pass from a unit test. Accept explicit maintainer
          exceptions and scope-appropriate explanations for omitted checks.
          When fork CI awaits approval, identify maintainer action after inspecting
          the workflow changes; do not ask the author to obtain unavailable rights.
          State the evaluated head and evidence revisions in the result. Consolidate
          remaining gaps with their affected contract, smallest check, and owner;
          do not repeat satisfied requirements or unrelated rerun instructions.
          A bot pass or exception never waives required CI or branch protection.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
      - REVIEWING.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - archify/references/delivery-contract.md
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
